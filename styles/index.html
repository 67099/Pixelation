<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Hunt</title>
    <link rel="icon" href="/images/icon.png" type="image/png">
    <link rel="stylesheet" href="/styles/main.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.3.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <header class="site-header">
        <h1 class="logo"><img src="/images/icon.png" alt=""> PIXEL HUNT</h1>
        <p class="tagline">خمّن الصورة قبل ما تتضح!</p>
    </header>

    <main id="main-content">
        <section id="auth-section" class="pixel-panel">
            <h2 id="auth-title"></h2>
            <form id="auth-form">
                <div class="field">
                    <label for="username">اسم المستخدم</label>
                    <input type="text" class="pixel-input" id="username" required>
                </div>
                <div class="field">
                    <label for="password">كلمة المرور</label>
                    <input type="password" class="pixel-input" id="password" required>
                </div>
                <button type="submit" class="pixel-btn" id="auth-submit"></button>
            </form>
            <a href="#" id="toggle-auth-mode"></a>
        </section>

        <section id="game-room-section" style="display: none;"></section>
    </main>

    <footer class="site-footer">
        <p>Developed by Khaled Almathami — <a href="https://github.com/67099" target="_blank" rel="noopener">67099</a></p>
    </footer>

    <script src="/socket.io/socket.io.js"></script>

    <script src="../js/controllers/RoomManager.js"></script>
    <script src="../js/controllers/ImageRenderer.js"></script>

    <script src="../js/views/AuthenticatorView.js"></script>
    <script src="../js/views/GameRoomView.js"></script>

    <script src="../js/App.js"></script>

</body>
</html>
