<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Hunt - تسجيل الدخول</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="/styles/main.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.3.0/dist/confetti.browser.min.js"></script> 
</head>
<body>
    
    <main class="container my-5" id="main-content">
        <section id="auth-section" class="card shadow-lg mx-auto" style="max-width: 400px;">
            <div class="card-body">
                <h2 class="card-title text-center" id="auth-title"></h2>
                <form id="auth-form">
                    <div class="mb-3">
                        <label for="username" class="form-label">اسم المستخدم</label>
                        <input type="text" class="form-control" id="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">كلمة المرور</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100" id="auth-submit"></button>
                </form>
                <div class="text-center mt-3">
                    <a href="#" id="toggle-auth-mode"></a>
                </div>
            </div>
        </section>

        <section id="game-room-section" class="container my-5" style="display: none;">
        </section>
    </main>

  <script src="/socket.io/socket.io.js"></script> 

    <script src="../js/controllers/RoomManager.js"></script>
    <script src="../js/controllers/ImageRenderer.js"></script>
    
    <script src="../js/views/AuthenticatorView.js"></script>
    <script src="../js/views/GameRoomView.js"></script>

    <script src="../js/App.js"></script>

</body>
</html>
